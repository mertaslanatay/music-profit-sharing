name: cPanel'e dağıt

# main'e her push'ta: bulutta build alır, build çıktısını "deploy" dalına
# push'lar, sonra sunucudaki uygulamanın kendi dağıtım kancasını (webhook)
# çağırarak sunucunun kendi kendini güncellemesini tetikler.
#
# Bu hosting planında SSH/SFTP YOK (yalnızca FTP) — bu yüzden dosya
# yükleme/SSH yerine sunucu tarafı kendi git deposundan çeker. Elle tar.gz
# indirip cPanel'e yükleme adımını tamamen ortadan kaldırır.
#
# Kurulum için Mert'in yapması gerekenler — bkz. proje notları
# (claude/deploy-otomasyonu.md):
#   1) cPanel → Dosyalar → Git™ Version Control ile bu reponun "deploy"
#      dalını m4nm-app klasörüne bir kere klonla (SSH gerekmez).
#   2) cPanel → Setup Node.js App → m4nm-app → ortam değişkenlerine
#      DEPLOY_HOOK_SECRET ekle (uzun/rastgele bir değer).
#   3) GitHub reposunda Settings → Secrets and variables → Actions altına
#      şu secret'ları ekle: DEPLOY_HOOK_SECRET (adım 2'deki AYNI değer),
#      DEPLOY_HOOK_URL (ör. https://label.m4nm.net/api/internal/deploy-hook),
#      DATABASE_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#      NEXT_PUBLIC_SITE_URL
#   4) Artık gerekmeyen eski secret'lar (istersen silebilirsin):
#      SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, SSH_PASSPHRASE,
#      NODE_VENV_ACTIVATE (bu sonuncusu GitHub'dan silinebilir — artık
#      cPanel'in kendi Node.js App ortam değişkeni olarak tanımlanıyor)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# GITHUB_TOKEN varsayılan olarak salt-okunur geliyor — "deploy" dalına
# force-push atabilmemiz için burada açıkça yazma izni istiyoruz. Bu,
# reponun Settings → Actions → General → Workflow permissions ayarının
# en az "Read and write permissions" olmasını GEREKTİRİR; o ayar daha
# kısıtlıysa (Read-only) bu satır tek başına yetmez.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      - name: .env.local yaz (yalnızca build anı için, commit edilmez)
        run: |
          cat > .env.local <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EOF

      - name: Build (prebuild env kontrolü dahil)
        run: npm run build

      - name: deploy dalına build çıktısını push'la
        run: |
          set -e
          git config user.name "m4nm-deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"

          # Build çıktısını ve sunucuda gereken dosyaları, main'deki geçmişten
          # bağımsız, tek-commit'lik bir "deploy" dalına topluyoruz. Sunucu bu
          # dalı yalnızca `git reset --hard` ile takip ediyor — kendi tam
          # git geçmişini tutmasına gerek yok, sadece son hâli.
          rm -rf /tmp/deploy-worktree
          git worktree add --detach /tmp/deploy-worktree
          cd /tmp/deploy-worktree
          git checkout --orphan deploy
          git rm -rf . > /dev/null 2>&1 || true

          cd "$GITHUB_WORKSPACE"
          for item in .next next.config.mjs package.json package-lock.json server.js public supabase; do
            cp -a "$item" /tmp/deploy-worktree/
          done
          rm -rf /tmp/deploy-worktree/.next/cache

          cd /tmp/deploy-worktree
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:deploy

      - name: Sunucuya dağıtım kancasını tetikle
        run: |
          set -e
          http_code=$(curl -sS -o /tmp/deploy-hook-response.json -w '%{http_code}' \
            -X POST "${{ secrets.DEPLOY_HOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_HOOK_SECRET }}" \
            --max-time 300)
          echo "Kanca yanıtı (HTTP $http_code):"
          cat /tmp/deploy-hook-response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Dağıtım kancası başarısız oldu (HTTP $http_code)." >&2
            exit 1
          fi
